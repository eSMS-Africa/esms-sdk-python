[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "esms-sms"
version = "1.1.0"
description = "Official Python SDK for the eSMS Africa SMS API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "eSMS Africa", email = "support@esmsafrica.io" }]
keywords = ["esms", "sms", "africa", "bulk sms", "otp", "messaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.0"]

[project.urls]
Homepage = "https://esmsafrica.io"
Documentation = "https://docs.esmsafrica.io/docs/sdks"
Source = "https://github.com/eSMS-Africa/esms-sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["src/esms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
